name: 🛠️ Bug report / 不具合の報告
description: Something in the application or the conversion behaves incorrectly. / アプリの動作や変換結果に問題がある場合。
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this.

        Before filing, please [search existing issues](https://github.com/cri-middleware/SSConverterGUI/issues?q=is%3Aissue).
        **Do not attach proprietary `.sspj` files here** — this is a public tracker. Send them privately through the
        [Japanese Help Center form](https://www.webtech.co.jp/help/ja/spritestudio7/inquiries/ssplayer_tool/), which takes a zip of up to 8 MB.

        投稿前に既存の Issue を検索してください。**業務データの `.sspj` は公開の場である本 Issue に添付しないでください。** 送付が必要な場合は[ヘルプセンター](https://www.webtech.co.jp/help/ja/spritestudio7/inquiries/ssplayer_tool/)をご利用ください（8 MB までの zip を添付できます）。

  - type: textarea
    id: what-happened
    attributes:
      label: What happened? / 症状
      description: What you expected, and what you got instead. / 期待した挙動と、実際の挙動。
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce / 再現手順
      description: |
        The smallest sequence that shows the problem.
        問題を再現できる最小限の手順。
      placeholder: |
        1. Select ...
        2. Check "Embedded Assets"
        3. Convert
        4. See ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Application version / アプリのバージョン
      description: Shown in the application window. / アプリ画面に表示されているバージョン。
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - macOS (Apple silicon)
        - macOS (Intel)
        - Windows 11
        - Windows 10
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: OS version / OS のバージョン
      placeholder: macOS 15.5 / Windows 11 24H2
    validations:
      required: true

  - type: textarea
    id: input
    attributes:
      label: Input project / 入力プロジェクト
      description: |
        A single file or a folder? Roughly how many `.sspj`? Was "Embedded Assets" checked?
        単一ファイルかフォルダか、`.sspj` の概数、"Embedded Assets" の有無。

  - type: textarea
    id: logs
    attributes:
      label: Log output / ログ
      description: The log shown at the bottom of the application window. / アプリ画面下部に表示されているログ。
      render: text

  - type: textarea
    id: conversion
    attributes:
      label: Is it the conversion itself? / 変換処理そのものの問題ですか？
      description: |
        A wrong `.ssab`, or a crash while converting a `.sspj`, most likely belongs to the shared
        conversion engine rather than this application, and saying so here saves a round trip.
        出力される `.ssab` がおかしい、`.sspj` の変換中にクラッシュするといった場合は、このアプリではなく共通の変換エンジン側の可能性が高いため、その旨をお書きください。
