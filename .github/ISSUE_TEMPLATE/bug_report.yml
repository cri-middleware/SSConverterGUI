name: 🐛 Bug report / 不具合の報告
description: Something in the application or the conversion misbehaves (file selection, UI, history, logs, output). / アプリの動作や変換結果に問題がある場合
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. / ご報告ありがとうございます。

        **Is the problem in the conversion itself** — a wrong `.ssab`, or a crash while converting
        a `.sspj`? That belongs to the shared conversion engine. Report it here all the same and
        say so; we will route it.

        **変換処理そのものの問題**（出力される `.ssab` がおかしい、`.sspj` の変換中にクラッシュする等）は共通の変換エンジン側の課題です。こちらにその旨を添えてご報告ください。こちらで振り分けます。

  - type: input
    id: version
    attributes:
      label: Application version / アプリのバージョン
      description: Shown in the application window. / アプリ画面に表示されているバージョン。
      placeholder: 7.0.0-beta.1
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - macOS (Apple silicon)
        - macOS (Intel)
        - Windows 11
        - Windows 10
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: OS version / OS のバージョン
      placeholder: macOS 15.5 / Windows 11 24H2
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened? / 発生した事象
      description: What did you expect, and what happened instead? / 期待した動作と、実際の動作。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 再現手順
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / ログ
      description: >
        Paste the log shown at the bottom of the application window. / アプリ画面下部に表示されているログを貼り付けてください。
      render: text

  - type: textarea
    id: input
    attributes:
      label: Input project / 入力プロジェクト
      description: >
        Single file or a folder? Roughly how many `.sspj`? Was "Embedded Assets" checked?
        Please do **not** attach confidential data here — ask through the
        [inquiry form](https://www.webtech.co.jp/contact/en.html)
        instead. / 単一ファイルかフォルダか、`.sspj` の概数、"Embedded Assets" の有無。機密データは添付せず、ヘルプセンターをご利用ください。
