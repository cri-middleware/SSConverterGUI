# Questions and private reports each have a better home than this tracker —
# send them there before an issue is opened, not after.
#
# Conversion-engine bugs are reported here too, and routed from here. The
# engine lives in SpriteStudio-SDK, which is not public, so its tracker would
# 404 for exactly the people who would follow a link to it.
blank_issues_enabled: false
contact_links:
  - name: ❓ How do I use the app? / 使い方の質問
    url: https://spritestudio.jp/community/
    about: Questions and tips belong in the SpriteStudio Community forum. / 使い方のご質問や情報交換は公式コミュニティへ。

  - name: 🔒 Private inquiry (English)
    url: https://www.webtech.co.jp/contact/en.html
    about: Private or contractual support. The English form has no file upload — ask here and we will arrange a transfer.

  - name: 🔒 非公開のお問い合わせ・大きな再現データ（日本語）
    url: https://www.webtech.co.jp/help/ja/spritestudio7/inquiries/ssplayer_tool/
    about: 非公開のご相談と再現データの送付（zip・8MB まで）は公式ヘルプセンターへ。

  - name: 🛡️ Security vulnerability / 脆弱性の報告
    url: https://github.com/cri-middleware/SSConverterGUI/blob/HEAD/SECURITY.md
    about: Do not open a public issue. See the security policy for how to report privately. / 公開 Issue ではなく非公開でご報告ください。
