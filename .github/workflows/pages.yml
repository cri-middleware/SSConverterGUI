name: Publish docs via GitHub Pages

# Build the Zensical site (one run per locale) and deploy it to GitHub Pages via the
# artifact method
# (no gh-pages branch) — matching SSPlayerForGodot / SSPlayerForRenPy.
#
# The site documents the *released* application (the install guide sends users to
# Releases), so publishing is tied to a published release rather than to every
# merge on main — the same decoupling SSPlayerForWeb applies. Use "Run workflow"
# for an immediate refresh, e.g. a docs fix that should not wait for the next
# release.
#
# A published release or a manual dispatch deploys, and nothing else does — the
# same trigger pair every sibling repository uses. The --strict build that guards it
# runs earlier too: docs.yml runs it on a pull request that touches the docs, and
# ci.yml weekly and on the release PR.
on:
  release:
    types: [published]
  workflow_dispatch:

# Least privilege at the workflow level: only the deploy job needs the Pages /
# OIDC write scopes, so they are granted there rather than to every job.
permissions:
  contents: read

# Never run two deploys at once; let an in-progress deploy finish rather than
# cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The docs build never touches the SpriteStudio-SDK submodule, so skip it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.x
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - run: echo "cache_id=$(date --utc '+%V')" >> "$GITHUB_ENV"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: zensical-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            zensical-

      # Both steps below run the same scripts a contributor runs locally, rather than
      # repeating the commands here, and so does docs.yml, which builds the docs on a
      # pull request. That build catches what this one would hit only while both run
      # the scripts — the fewer places the build is spelled out, the better.
      #
      # prepare-docs.sh creates .venv and installs the pins from docs/requirements.txt;
      # build-pages.sh then finds zensical there. (It falls back to PATH when there is no
      # venv, so a plain `pip install -r docs/requirements.txt` step would still work
      # here — but then CI and the README would be running different things.) It stays a
      # step of its own so a dependency failure is legible as one in the run summary,
      # which is also why build-pages.sh is invoked below with prepare=no.
      - name: Install dependencies
        run: ./scripts/prepare-docs.sh

      # scripts/build-pages.sh is the tree this job uploads. Here that is the two locale
      # builds and nothing else — the site carries no demo and no examples — so it runs
      # build-docs.sh and adds only what a working tree needs on top (the toolchain, and
      # a server to look at the result). Running it here is what keeps CI and the local
      # build from drifting apart, and it is the same command in every repository in the
      # family, whatever else that repository's site carries.
      #
      # --strict fails the build on broken links / missing nav entries, so a publish
      # aborts rather than deploying a site with a dead link.
      # One build per locale - there is no plugin producing both from a single run any
      # more - English first, because the English build wipes site/ and the Japanese site
      # lives inside it at site/ja. build-docs.sh owns that order; the reason it exists is
      # that the opposite order silently publishes a site with no Japanese pages at all.
      #
      # Every option is spelled out rather than left to the script's defaults: they are
      # chosen for a working tree, and a publish should not change because one of them did.
      - name: Build the Pages tree (docs, both locales, strict validation)
        run: ./scripts/build-pages.sh prepare=no serve=no

      # Only the MkDocs output (site/) is served — no examples/demos to bundle.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Permissions required by the artifact-based Pages deploy. No contents:write —
    # there is no gh-pages branch.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
