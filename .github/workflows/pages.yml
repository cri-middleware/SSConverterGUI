name: Publish docs via GitHub Pages

# Build the Zensical site (one run per locale) and deploy it to GitHub Pages via the
# artifact method
# (no gh-pages branch) — matching SSPlayerForGodot / SSPlayerForRenPy.
#
# The site documents the *released* application (the install guide sends users to
# Releases), so publishing is tied to a published release rather than to every
# merge on main — the same decoupling SSPlayerForWeb applies. Use "Run workflow"
# for an immediate refresh, e.g. a docs fix that should not wait for the next
# release.
#
# A published release or a manual dispatch deploys, and nothing else does — the
# same trigger pair every sibling repository uses. Note the trade-off: --strict now
# runs at deploy time only, so a broken link surfaces on the release build rather
# than on the PR that introduced it. Run both locale builds locally before merging
# a docs change.
on:
  release:
    types: [published]
  workflow_dispatch:

# Least privilege at the workflow level: only the deploy job needs the Pages /
# OIDC write scopes, so they are granted there rather than to every job.
permissions:
  contents: read

# Never run two deploys at once; let an in-progress deploy finish rather than
# cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The docs build never touches the SpriteStudio-SDK submodule, so skip it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.x
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - run: echo "cache_id=$(date --utc '+%V')" >> "$GITHUB_ENV"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: zensical-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            zensical-

      # Both steps below run the same scripts a contributor runs locally, rather than
      # repeating the commands here. Nothing builds the docs on a pull request, so there
      # is no PR run to catch a divergence between the two — the fewer places the build
      # is spelled out, the better.
      #
      # prepare-docs.sh creates .venv and installs the pins from docs/requirements.txt;
      # build-docs.sh then finds zensical there. (It falls back to PATH when there is no
      # venv, so a plain `pip install -r docs/requirements.txt` step would still work
      # here — but then CI and the README would be running different things.)
      - name: Install dependencies
        run: ./scripts/prepare-docs.sh

      # --strict fails the build on broken links / missing nav entries, so a publish
      # aborts rather than deploying a site with a dead link.
      # One build per locale - there is no plugin producing both from a single run any
      # more - English first, because the English build wipes site/ and the Japanese site
      # lives inside it at site/ja. build-docs.sh owns that order; the reason it exists is
      # that the opposite order silently publishes a site with no Japanese pages at all.
      - name: Build docs, both locales (strict validation)
        run: ./scripts/build-docs.sh

      # Only the MkDocs output (site/) is served — no examples/demos to bundle.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Permissions required by the artifact-based Pages deploy. No contents:write —
    # there is no gh-pages branch.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
