name: Release

# Run manually from the Actions tab. The release version comes from package.json.
on:
  workflow_dispatch:
    inputs:
      upload:
        description: 'Upload artifacts to GitHub Releases'
        type: boolean
        default: true

# Needed to create the release and upload assets.
permissions:
  contents: write

jobs:
  # Create the draft release up front so the platform build jobs only have to
  # attach assets to it (avoids a race where two jobs create the same release).
  # Skipped entirely when the upload checkbox is off.
  create-release:
    if: ${{ inputs.upload }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version from package.json
        id: meta
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: SsConverter GUI ${{ steps.meta.outputs.tag }}
          draft: true
          prerelease: ${{ contains(steps.meta.outputs.version, '-') }}
          body: |
            Portable builds (no installer):
            - macOS: `.app.tar.gz` (universal, signed & notarized) - unpack and move `SSConverterGUI.app` to Applications.
            - Windows: `.zip` containing the portable `SSConverterGUI.exe` (requires WebView2 runtime, preinstalled on Windows 10/11).

  build:
    needs: create-release
    # Build even when create-release was skipped (upload off); only skip on its failure.
    if: ${{ !cancelled() && needs.create-release.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Universal binary (arm64 + x86_64)
            args: '--bundles app --target universal-apple-darwin'
          - platform: windows-latest # Portable exe only
            args: '--no-bundle'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v7
        with:
          # The ssconverter SDK is a git submodule; it must be fetched.
          submodules: recursive
          # Full history so the converter's build script can embed the git SHA.
          fetch-depth: 0

      - name: Resolve version from package.json
        shell: bash
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # Universal macOS builds need both arch targets installed.
          targets: "${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}"

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.platform }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Build only (no tagName) - code signing & notarization happen in-place
      # during this build step when the APPLE_* env vars are present.
      - name: Build app
        uses: tauri-apps/tauri-action@v1
        env:
          # macOS code signing (Developer ID Application). Absent on Windows.
          APPLE_CERTIFICATE: ${{ secrets.SS_APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.SS_APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.SS_APPLE_SIGNING_IDENTITY }}
          # macOS notarization via Apple ID + app-specific password.
          APPLE_ID: ${{ secrets.SS_APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.SS_APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.SS_APPLE_TEAM_ID }}
        with:
          args: ${{ matrix.args }}

      - name: Package macOS artifact (.app.tar.gz)
        if: matrix.platform == 'macos-latest'
        run: |
          APP_DIR="src-tauri/target/universal-apple-darwin/release/bundle/macos"
          APP_NAME=$(basename "$(ls -d "$APP_DIR"/*.app | head -1)")
          tar -czf "SSConverterGUI_${VERSION}_universal.app.tar.gz" -C "$APP_DIR" "$APP_NAME"

      - name: Package Windows artifact (.zip)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $exe = Get-ChildItem "src-tauri/target/release/*.exe" | Select-Object -First 1
          $staging = "SSConverterGUI"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item $exe.FullName -Destination "$staging/SSConverterGUI.exe"
          Compress-Archive -Path "$staging/SSConverterGUI.exe" `
            -DestinationPath "SSConverterGUI_${env:VERSION}_x64.zip"

      # Always keep the built files as workflow artifacts so a run is useful
      # even when the Releases upload is turned off.
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}
          path: |
            *.app.tar.gz
            *.zip
          if-no-files-found: warn

      - name: Upload artifact to release
        if: ${{ inputs.upload }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          name: SsConverter GUI ${{ needs.create-release.outputs.tag }}
          draft: true
          prerelease: ${{ contains(needs.create-release.outputs.version, '-') }}
          files: |
            *.app.tar.gz
            *.zip
