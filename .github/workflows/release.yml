name: Release

# Run manually from the Actions tab. Matches the sibling repos' release flow
# (SpriteStudio-SDK / SSPlayerForGodot / SSPlayerForRenPy): the ref decides.
# A run from a branch only builds — for QA on a release/X.Y branch. A run from
# a v* tag also drafts the GitHub Release, unless upload_release is turned off
# or the tag already has one; publishing it is a manual step.
on:
  workflow_dispatch:
    inputs:
      upload_release:
        description: 'Draft the GitHub Release, to publish by hand. Only from a v* tag that has no Release yet; from a branch the run is a build.'
        required: false
        default: true
        type: boolean

# Least privilege at the workflow level: the build job (which holds the Apple
# signing secrets and runs third-party actions) needs only read. The write scope
# to create the Release is granted to the `package` job alone, below.
permissions:
  contents: read

# One run per ref at a time. A second dispatch of the same tag waits for the
# first rather than cancelling it, so a half-built release is never abandoned.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Third-party actions are pinned to a full commit SHA (tag in the trailing
# comment) so a moved/retagged release can't inject code into jobs that carry
# secrets or write scope. Bump deliberately (Dependabot: github-actions).
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Universal binary (arm64 + x86_64)
            arch: universal
          - platform: windows-latest # Portable exe only
            arch: x86_64
          # arm64 cross-compiles from this x86_64 runner (MSVC ships the ARM64
          # toolchain), mirroring how the SDK builds its Windows arm64 CLI. The
          # script builds it with `--no-bundle`, so no installer generator has to
          # understand the target architecture.
          - platform: windows-latest # Portable exe only, cross-compiled
            arch: arm64

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 120

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The ssconverter SDK is a git submodule; it must be fetched.
          submodules: recursive
          # Full history so the converter's build script can embed the git SHA.
          fetch-depth: 0
          persist-credentials: false

      # Through the script, so the version has one definition shared with
      # build-release.sh and with anyone cutting a release by hand.
      - name: Resolve version from package.json
        shell: bash
        run: echo "VERSION=$(./scripts/release-version.sh)" >> "$GITHUB_ENV"

      # The artifacts embed the package.json version while the Release is
      # named after the tag — fail fast when the two disagree.
      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          if [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${VERSION}"
            exit 1
          fi

      # Guard against shipping the unreleased CHANGELOG placeholder date
      # (e.g. "Unreleased"): the top entry's date must be a real YYYY-MM-DD.
      - name: Check CHANGELOG has a real release date
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          header=$(grep -m1 '^## \[' CHANGELOG.md || true)
          echo "Top CHANGELOG entry: ${header}"
          date_part=$(printf '%s' "${header}" | sed -E 's/.*- //')
          if ! printf '%s' "${date_part}" | grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "::error::CHANGELOG.md top entry has a non-date '${date_part}' — set the real release date before tagging."
            exit 1
          fi

      # No `version:` — it comes from package.json's `packageManager` field.
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          # Pinned by SHA, so the channel must be named explicitly here (the
          # action can no longer infer it from a `@stable` ref).
          toolchain: stable
          # No `targets:` — the release scripts add the ones they need.

      # The shipped binary statically links the whole Rust dependency graph, so
      # its third-party license notices must ship with it. cargo-about (no
      # `targets` in about.toml) evaluates the union of all targets, so the file
      # is identical on each runner; the release scripts regenerate it per build
      # only so every archive is self-contained.
      - name: Install cargo-about
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-about

      # Decode the App Store Connect API key (.p8) used for notarization and
      # expose its path to the build step. No-ops when the secret is absent,
      # leaving the app un-notarized. macOS only.
      - name: Prepare Apple API key
        if: matrix.platform == 'macos-latest'
        env:
          ASC_API_KEY_PASS: ${{ secrets.ASC_API_KEY_PASS }}
        run: |
          if [ -z "$ASC_API_KEY_PASS" ]; then
            echo "ASC_API_KEY_PASS not set — skipping API key setup (the app will not be notarized)."
            exit 0
          fi
          echo "$ASC_API_KEY_PASS" | base64 --decode > "$RUNNER_TEMP/apple_api_key.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/apple_api_key.p8" >> "$GITHUB_ENV"

      # scripts/build-release.sh runs scripts/release-macos.sh — which builds,
      # signs, notarizes, verifies and packages, the Tauri CLI importing
      # APPLE_CERTIFICATE into a keychain of its own — and then checks the
      # archive it produced. Signing is the environment's to decide: with none of
      # the APPLE_* secrets set the app is simply unsigned.
      #
      # Except on a v* tag, the only ref that can publish a Release, where
      # `sign=yes` makes the script's inspection of the real .app fatal. A
      # missing or expired secret otherwise turns signing into a silent no-op,
      # and looks exactly like "signing was never requested".
      - name: Build and package (macOS)
        if: matrix.platform == 'macos-latest'
        env:
          # macOS code signing (Developer ID Application).
          APPLE_CERTIFICATE: ${{ secrets.APPLE_DEV_ID_APP_CERT }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEV_ID_APP_CERT_PASS }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_DEV_ID_APP_NAME }}
          # macOS notarization via App Store Connect API key.
          APPLE_API_ISSUER: ${{ secrets.ASC_API_ISSUER_ID }}
          APPLE_API_KEY: ${{ secrets.ASC_API_KEY_ID }}
        run: ./scripts/build-release.sh sign=${{ startsWith(github.ref, 'refs/tags/v') && 'yes' || 'auto' }}

      # The same script for the Windows half: it runs
      # scripts/release-windows.ps1 for the arch this matrix entry builds — the
      # host x86_64 build or the arm64 cross-build — and then checks the archive.
      # The Windows exe is deliberately not code-signed, so this step needs no
      # secrets and there is no sign= to pass.
      - name: Build and package (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: ./scripts/build-release.ps1 arch=${{ matrix.arch }}

      - name: Upload workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Both Windows entries run on windows-latest, so the arch is what
          # keeps their artifact names distinct.
          name: SSConverterGUI-${{ matrix.platform }}-${{ matrix.arch }}
          # Globbing the archives, not the directory, keeps the Windows staging
          # folder out of the artifact.
          path: |
            dist-release/*.tar.gz
            dist-release/*.zip
          if-no-files-found: error
          # A week, not the 90-day default: this is the matrix's handoff to the
          # package job, not something to keep. See the same setting there.
          retention-days: 7

  package:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only this job needs write access, and only to create the Release.
    permissions:
      contents: write

    steps:
      # scripts/build-release.sh reads package.json for the version the archives
      # are named after, so the tree has to be here — the download alone is not
      # enough any more.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-tags: true
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-dist
          merge-multiple: true

      # The ref decides what the run is: a v* tag is a release, anything else is
      # a build, kept on the run and drafting nothing. A tag that already has a
      # Release, draft or published, keeps it as it is, so a run from an old tag
      # rebuilds without touching the files people have downloaded and checked
      # against its SHA256SUMS. To have a Release made again, delete it first.
      - name: Decide on the GitHub Release
        id: release
        if: inputs.upload_release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *) echo "::notice::${GITHUB_REF_NAME} is not a v* tag — a build, no Release."; exit 0 ;;
          esac
          if out="$(gh release view "$GITHUB_REF_NAME" --json isDraft 2>&1)"; then
            echo "::notice::${GITHUB_REF_NAME} already has a Release — left as it is. Delete it to have it made again."
          elif [ "$out" = "release not found" ]; then
            echo "draft=true" >> "$GITHUB_OUTPUT"
          else
            echo "$out"
            exit 1
          fi

      # The same script again, with build=no: the phase after the matrix. It
      # checks the three archives are all present, named after this version and
      # nothing else, then writes the checksum manifest over them. The build jobs
      # already signed, notarized and archived their own platform, so there is
      # nothing to lay out — what this adds is the check that they all arrived.
      # Three jobs on two operating systems feed this directory, and a matrix
      # entry that built nothing leaves a Release with no download for that
      # platform, which nobody notices until somebody on it tries.
      - name: Collect and check the release
        run: ./scripts/build-release.sh build=no in=release-dist verify=yes

      # Keep the bundle as a workflow artifact so a QA run from a branch is
      # useful without creating a Release.
      - name: Upload final release package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SSConverterGUI-release-dist
          path: release-dist
          if-no-files-found: error
          # A week, not the 90-day default. What is meant to last is attached to
          # the GitHub Release, which never expires; this is a copy for a run
          # that uploaded nothing. Artifact storage is an org-wide quota, and a
          # full one does not degrade — `upload-artifact` fails, so the release
          # build fails, in a step that has nothing to do with the release.
          retention-days: 7

      # The pre-release mark the draft carries: one once a full release is
      # tagged, none before (scripts/release-channel.sh).
      # A patch to an earlier line also names the full release before it in that
      # line, which the generated notes start from instead of the newest release.
      - name: Read the Release's channel
        id: channel
        if: steps.release.outputs.draft == 'true'
        run: |
          channel="$(./scripts/release-channel.sh "$GITHUB_REF_NAME")"
          echo "::notice::${GITHUB_REF_NAME} is a ${channel} release"
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"
          if [ "$channel" = old ]; then
            previous="$(git tag --list "${GITHUB_REF_NAME%.*}.*" --sort=v:refname |
              awk -v tag="$GITHUB_REF_NAME" '$0 == tag { print previous; exit } $0 !~ /-|[0-9](a|b|rc)[0-9]+$/ { previous = $0 }')"
            echo "previous=${previous}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: steps.release.outputs.draft == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            release-dist/*.tar.gz
            release-dist/*.zip
            release-dist/SHA256SUMS
          tag_name: ${{ github.ref_name }}
          # No `body`, as in the sibling repos: the generated notes are the
          # release page, and everything else lives in the install guide.
          generate_release_notes: true
          previous_tag: ${{ steps.channel.outputs.previous }}
          # Always a draft, as in the sibling repos: a human checks the assets
          # and the generated notes, then publishes it from the GitHub UI as it
          # is marked. A draft cannot be made Latest; publishing one that is not
          # a pre-release makes it so.
          draft: true
          prerelease: ${{ steps.channel.outputs.channel == 'prerelease' }}
