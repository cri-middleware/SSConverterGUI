name: Release

# Run manually from the Actions tab. Matches the sibling repos' release flow
# (SpriteStudio-SDK / SSPlayerForGodot / SSPlayerForRenPy): the default
# (upload_release=false) only builds — for QA on a release/X.Y branch.
# Creating the GitHub Release happens only on an explicit dispatch on a
# v* tag ref with upload_release=true.
on:
  workflow_dispatch:
    inputs:
      upload_release:
        description: 'Upload to GitHub Release (only effective on a v* tag ref)'
        required: false
        default: false
        type: boolean

# Least privilege at the workflow level: the build job (which holds the Apple
# signing secrets and runs third-party actions) needs only read. The write scope
# to create the Release is granted to the `package` job alone, below.
permissions:
  contents: read

concurrency:
  group: release-${{ github.actor }}-${{ github.head_ref || github.run_number }}-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to a full commit SHA (tag in the trailing
# comment) so a moved/retagged release can't inject code into jobs that carry
# secrets or write scope. Bump deliberately (Dependabot: github-actions).
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Universal binary (arm64 + x86_64)
            args: '--bundles app --target universal-apple-darwin'
          - platform: windows-latest # Portable exe only
            args: '--no-bundle'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          # The ssconverter SDK is a git submodule; it must be fetched.
          submodules: recursive
          # Full history so the converter's build script can embed the git SHA.
          fetch-depth: 0

      - name: Resolve version from package.json
        shell: bash
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      # The artifacts embed the package.json version while the Release is
      # named after the tag — fail fast when the two disagree.
      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          if [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${VERSION}"
            exit 1
          fi

      # Guard against shipping the unreleased CHANGELOG placeholder date
      # (e.g. "2026-0X-XX"): the top entry's date must be a real YYYY-MM-DD.
      - name: Check CHANGELOG has a real release date
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          header=$(grep -m1 '^## \[' CHANGELOG.md || true)
          echo "Top CHANGELOG entry: ${header}"
          date_part=$(printf '%s' "${header}" | sed -E 's/.*- //')
          if ! printf '%s' "${date_part}" | grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "::error::CHANGELOG.md top entry has a non-date '${date_part}' — set the real release date before tagging."
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          # Pinned by SHA, so the channel must be named explicitly here (the
          # action can no longer infer it from a `@stable` ref).
          toolchain: stable
          # Universal macOS builds need both arch targets installed.
          targets: "${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}"

      - name: Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.platform }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Decode the App Store Connect API key (.p8) used for notarization and
      # expose its path to the build step. No-ops when the secret is absent,
      # leaving the app un-notarized. macOS only.
      - name: Prepare Apple API key
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.SS_APPLE_API_KEY_BASE64 }}
        run: |
          if [ -z "$APPLE_API_KEY_BASE64" ]; then
            echo "SS_APPLE_API_KEY_BASE64 not set — skipping API key setup (the app will not be notarized)."
            exit 0
          fi
          echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/apple_api_key.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/apple_api_key.p8" >> "$GITHUB_ENV"

      # Build only (no tagName) - code signing & notarization happen in-place
      # during this build step when the APPLE_* env vars are present.
      - name: Build app
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          # macOS code signing (Developer ID Application). Absent on Windows.
          APPLE_CERTIFICATE: ${{ secrets.SS_APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.SS_APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.SS_APPLE_SIGNING_IDENTITY }}
          # macOS notarization via App Store Connect API key.
          # APPLE_API_KEY_PATH is set by the "Prepare Apple API key" step.
          APPLE_API_ISSUER: ${{ secrets.SS_APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.SS_APPLE_API_KEY }}
        with:
          args: ${{ matrix.args }}

      # A missing, expired, or misnamed Apple secret silently turns the steps
      # above into no-ops, which would ship an unsigned .app under a Release that
      # advertises it as signed & notarized. Inspect the real artifact rather than
      # trusting that the env was populated.
      - name: Verify signature and notarization
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          # Mandatory on a v* tag (the only ref that can publish a Release); a QA
          # build may legitimately run without the secrets, so there it warns.
          REQUIRED: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          # Deliberately no `set -e`: every check must run so the log shows all
          # failures at once, not just the first.
          set -uo pipefail
          APP=$(ls -d src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app | head -1)
          echo "Verifying ${APP}"
          status=0
          codesign --verify --deep --strict --verbose=2 "$APP" || {
            echo "::error::code signature is missing or invalid"; status=1; }
          codesign -dvv "$APP" 2>&1 | grep -q 'Authority=Developer ID Application' || {
            echo "::error::not signed by a Developer ID Application certificate"; status=1; }
          # A stapled ticket is what lets Gatekeeper clear the app offline; without
          # it a notarized build still prompts users on a machine with no network.
          xcrun stapler validate "$APP" || {
            echo "::error::no stapled notarization ticket"; status=1; }
          spctl --assess --type execute -vvv "$APP" || {
            echo "::error::Gatekeeper rejected the app"; status=1; }
          if [ "$status" -ne 0 ]; then
            if [ "$REQUIRED" = "true" ]; then
              echo "::error::a release build must be signed and notarized — check the SS_APPLE_* secrets"
              exit 1
            fi
            echo "::warning::unsigned build — expected when the SS_APPLE_* secrets are unavailable"
          fi

      # The shipped binary statically links the whole Rust dependency graph, so
      # its third-party license notices must ship with it. cargo-about (no
      # `targets` in about.toml) evaluates the union of all targets, so the file
      # is identical on each runner; it is regenerated here only so every archive
      # is self-contained.
      - name: Install cargo-about
        uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b # v2
        with:
          tool: cargo-about

      - name: Generate third-party license notices
        shell: bash
        run: |
          cargo about generate -c about.toml about.hbs \
            --manifest-path src-tauri/Cargo.toml \
            -o THIRD_PARTY_NOTICES.md

      # Tauri embeds the compiled frontend bundle in the same binary, so the npm
      # packages whose code lands in `dist/` need their notices shipped alongside
      # the Rust ones. Appends to the file cargo-about just wrote; fails loudly if
      # a dependency's license text cannot be located.
      - name: Append frontend (npm) license notices
        shell: bash
        run: node scripts/gen-npm-notices.mjs THIRD_PARTY_NOTICES.md

      - name: Package macOS artifact (.app.tar.gz)
        if: matrix.platform == 'macos-latest'
        run: |
          APP_DIR="src-tauri/target/universal-apple-darwin/release/bundle/macos"
          APP_NAME=$(basename "$(ls -d "$APP_DIR"/*.app | head -1)")
          # Ship the app alongside the license and third-party notices.
          cp LICENSE.md THIRD_PARTY_NOTICES.md "$APP_DIR/"
          tar -czf "SSConverterGUI_${VERSION}_universal.app.tar.gz" -C "$APP_DIR" "$APP_NAME" LICENSE.md THIRD_PARTY_NOTICES.md

      - name: Package Windows artifact (.zip)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $exe = Get-ChildItem "src-tauri/target/release/*.exe" | Select-Object -First 1
          $staging = "SSConverterGUI"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item $exe.FullName -Destination "$staging/SSConverterGUI.exe"
          Copy-Item "LICENSE.md" -Destination "$staging/LICENSE.md"
          Copy-Item "THIRD_PARTY_NOTICES.md" -Destination "$staging/THIRD_PARTY_NOTICES.md"
          Compress-Archive -Path "$staging/*" `
            -DestinationPath "SSConverterGUI_${env:VERSION}_x64.zip"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: SSConverterGUI-${{ matrix.platform }}
          path: |
            *.app.tar.gz
            *.zip
          if-no-files-found: error

  package:
    needs: build
    runs-on: ubuntu-latest
    # Only this job needs write access, and only to create the Release.
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: release-dist
          merge-multiple: true

      # Canonical checksum manifest so a consumer can verify each downloaded
      # file's integrity (`sha256sum -c SHA256SUMS --ignore-missing`).
      - name: Generate SHA256SUMS
        run: |
          cd release-dist
          sha256sum *.app.tar.gz *.zip > SHA256SUMS

      # Keep the bundle as a workflow artifact so a QA run
      # (upload_release=false) is useful without creating a Release.
      - name: Upload final release package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: SSConverterGUI-release-dist
          path: release-dist

      # Only on an explicit dispatch with upload_release=true, on a v* tag ref.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && inputs.upload_release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          files: |
            release-dist/*.app.tar.gz
            release-dist/*.zip
            release-dist/SHA256SUMS
          tag_name: ${{ github.ref_name }}
          # Prepended to the auto-generated notes.
          body: |
            Portable builds (no installer):
            - **macOS 10.15+**: `.app.tar.gz` (universal, signed & notarized) - unpack and move `SSConverterGUI.app` to Applications.
            - **Windows 10/11 (x64)**: `.zip` containing the portable `SSConverterGUI.exe` (requires the WebView2 runtime, preinstalled on Windows 10/11).

            > **Windows users:** the `.exe` is **not** code-signed, so SmartScreen shows
            > "Windows protected your PC" on first launch. Choose **More info → Run anyway**,
            > and verify the download against `SHA256SUMS` below if you want to be sure.

            Verify your download:
            ```
            sha256sum -c SHA256SUMS --ignore-missing          # macOS / Linux
            certutil -hashfile SSConverterGUI_x64.zip SHA256  # Windows (compare manually)
            ```

            Each archive includes `LICENSE.md` and `THIRD_PARTY_NOTICES.md`.
            See the [installation guide](https://cri-middleware.github.io/SSConverterGUI/install/) for details.
          generate_release_notes: true
          # The explicit upload_release=true dispatch is itself the publish
          # gate, so publish immediately instead of creating a draft.
          draft: false
          # SemVer pre-releases (e.g. v7.0.0-beta.1) contain '-' in the tag
          # name and are marked prerelease automatically.
          prerelease: ${{ contains(github.ref_name, '-') }}
