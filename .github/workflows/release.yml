name: Release

# Run manually from the Actions tab. Matches the sibling repos' release flow
# (SpriteStudio-SDK / SSPlayerForGodot / SSPlayerForRenPy): the default
# (upload_release=false) only builds — for QA on a release/X.Y branch.
# A draft GitHub Release is created only on an explicit dispatch on a
# v* tag ref with upload_release=true; publishing it is a manual step.
on:
  workflow_dispatch:
    inputs:
      upload_release:
        description: 'Create a draft GitHub Release (publish by hand afterwards; requires a v* tag ref)'
        required: false
        default: false
        type: boolean

# Least privilege at the workflow level: the build job (which holds the Apple
# signing secrets and runs third-party actions) needs only read. The write scope
# to create the Release is granted to the `package` job alone, below.
permissions:
  contents: read

concurrency:
  group: release-${{ github.actor }}-${{ github.head_ref || github.run_number }}-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to a full commit SHA (tag in the trailing
# comment) so a moved/retagged release can't inject code into jobs that carry
# secrets or write scope. Bump deliberately (Dependabot: github-actions).
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Universal binary (arm64 + x86_64)
            arch: universal
          - platform: windows-latest # Portable exe only
            arch: x86_64
          # arm64 cross-compiles from this x86_64 runner (MSVC ships the ARM64
          # toolchain), mirroring how the SDK builds its Windows arm64 CLI. The
          # script builds it with `--no-bundle`, so no installer generator has to
          # understand the target architecture.
          - platform: windows-latest # Portable exe only, cross-compiled
            arch: arm64

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The ssconverter SDK is a git submodule; it must be fetched.
          submodules: recursive
          # Full history so the converter's build script can embed the git SHA.
          fetch-depth: 0

      - name: Resolve version from package.json
        shell: bash
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      # The artifacts embed the package.json version while the Release is
      # named after the tag — fail fast when the two disagree.
      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          if [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${VERSION}"
            exit 1
          fi

      # Guard against shipping the unreleased CHANGELOG placeholder date
      # (e.g. "2026-0X-XX"): the top entry's date must be a real YYYY-MM-DD.
      - name: Check CHANGELOG has a real release date
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          header=$(grep -m1 '^## \[' CHANGELOG.md || true)
          echo "Top CHANGELOG entry: ${header}"
          date_part=$(printf '%s' "${header}" | sed -E 's/.*- //')
          if ! printf '%s' "${date_part}" | grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "::error::CHANGELOG.md top entry has a non-date '${date_part}' — set the real release date before tagging."
            exit 1
          fi

      # No `version:` — it comes from package.json's `packageManager` field.
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          # Pinned by SHA, so the channel must be named explicitly here (the
          # action can no longer infer it from a `@stable` ref).
          toolchain: stable
          # No `targets:` — the release scripts add the ones they need.

      - name: Rust cache
        uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.platform }}-${{ matrix.arch }}

      # The shipped binary statically links the whole Rust dependency graph, so
      # its third-party license notices must ship with it. cargo-about (no
      # `targets` in about.toml) evaluates the union of all targets, so the file
      # is identical on each runner; the release scripts regenerate it per build
      # only so every archive is self-contained.
      - name: Install cargo-about
        uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2
        with:
          tool: cargo-about

      # Decode the App Store Connect API key (.p8) used for notarization and
      # expose its path to the build step. No-ops when the secret is absent,
      # leaving the app un-notarized. macOS only.
      - name: Prepare Apple API key
        if: matrix.platform == 'macos-latest'
        env:
          ASC_API_KEY_PASS: ${{ secrets.ASC_API_KEY_PASS }}
        run: |
          if [ -z "$ASC_API_KEY_PASS" ]; then
            echo "ASC_API_KEY_PASS not set — skipping API key setup (the app will not be notarized)."
            exit 0
          fi
          echo "$ASC_API_KEY_PASS" | base64 --decode > "$RUNNER_TEMP/apple_api_key.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/apple_api_key.p8" >> "$GITHUB_ENV"

      # The script builds, signs, notarizes, verifies and packages; the Tauri CLI
      # imports APPLE_CERTIFICATE into a keychain of its own.
      #
      # A missing or expired secret silently turns signing into a no-op, so on a
      # v* tag — the only ref that can publish a Release — `--require-signing`
      # makes the script's check of the real .app fatal. A QA build without the
      # secrets only reports.
      - name: Build and package (macOS)
        if: matrix.platform == 'macos-latest'
        env:
          # macOS code signing (Developer ID Application).
          APPLE_CERTIFICATE: ${{ secrets.APPLE_DEV_ID_APP_CERT }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEV_ID_APP_CERT_PASS }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_DEV_ID_APP_NAME }}
          # macOS notarization via App Store Connect API key.
          APPLE_API_ISSUER: ${{ secrets.ASC_API_ISSUER_ID }}
          APPLE_API_KEY: ${{ secrets.ASC_API_KEY_ID }}
        run: ./scripts/release-macos.sh ${{ startsWith(github.ref, 'refs/tags/v') && '--require-signing' || '' }}

      # The Windows exe is deliberately not code-signed, so this step needs no
      # secrets. -Arch picks the host x86_64 build or the arm64 cross-build.
      - name: Build and package (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: ./scripts/release-windows.ps1 -Arch ${{ matrix.arch }}

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          # Both Windows entries run on windows-latest, so the arch is what
          # keeps their artifact names distinct.
          name: SSConverterGUI-${{ matrix.platform }}-${{ matrix.arch }}
          # Globbing the archives, not the directory, keeps the Windows staging
          # folder out of the artifact.
          path: |
            dist-release/*.tar.gz
            dist-release/*.zip
          if-no-files-found: error

  package:
    needs: build
    runs-on: ubuntu-latest
    # Only this job needs write access, and only to create the Release.
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: release-dist
          merge-multiple: true

      # Canonical checksum manifest so a consumer can verify each downloaded
      # file's integrity (`sha256sum -c SHA256SUMS --ignore-missing`).
      - name: Generate SHA256SUMS
        run: |
          cd release-dist
          sha256sum *.tar.gz *.zip > SHA256SUMS

      # Keep the bundle as a workflow artifact so a QA run
      # (upload_release=false) is useful without creating a Release.
      - name: Upload final release package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: SSConverterGUI-release-dist
          path: release-dist

      # The dispatch input is the only gate: dispatching on a v* tag is the
      # release operator's call, as the input description says.
      - name: Create GitHub Release
        if: inputs.upload_release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          files: |
            release-dist/*.tar.gz
            release-dist/*.zip
            release-dist/SHA256SUMS
          tag_name: ${{ github.ref_name }}
          # No `body`, as in the sibling repos: the generated notes are the
          # release page, and everything else lives in the install guide.
          generate_release_notes: true
          # Always a draft, as in the sibling repos: a human checks the assets
          # and the generated notes, then publishes from the GitHub UI, choosing
          # "Set as a pre-release" / "Set as the latest release" there. Hence no
          # prerelease / make_latest here — the same decision, made once, in the
          # place where the release is actually published.
          draft: true
