site_name: SSConverter GUI
site_description: "A cross-platform desktop app for converting SpriteStudio projects (.sspj) into .ssab binaries"
site_author: "CRI Middleware Co., Ltd."
site_url: "https://cri-middleware.github.io/SSConverterGUI/"
repo_name: "cri-middleware/SSConverterGUI"
repo_url: "https://github.com/cri-middleware/SSConverterGUI"
edit_uri: "edit/main/docs/"
# Rendered in the site footer. Deliberately year-less so it never goes stale.
copyright: "Copyright &copy; CRI Middleware Co., Ltd."

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - content.code.copy

plugins:
  - search
  - callouts
  - i18n:
      docs_structure: folder
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: ja
          name: 日本語
          build: true
          extra:
            # Footer icon labels (title / aria-label). Mirrors the `extra.social` list below.
            social:
              - icon: fontawesome/brands/github
                link: https://github.com/cri-middleware
                name: GitHub の cri-middleware
              - icon: material/web
                link: https://www.webtech.co.jp/spritestudio/
                name: OPTPiX SpriteStudio
          # Japanese nav labels. Keys must match the `nav:` titles below *exactly*,
          # emoji included - a mismatched key silently leaves the English label.
          nav_translations:
            🏠 Home: 🏠 ホーム
            📥 Installation: 📥 インストール
            ▶️ Usage: ▶️ 使い方
            🛠️ Development: 🛠️ 開発者向け

nav:
  - 🏠 Home: index.md
  - 📥 Installation: install.md
  - ▶️ Usage: usage.md
  - 🛠️ Development: development.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets

extra:
  # Footer icons. Keep to destinations that outlive any single release.
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/cri-middleware
      name: cri-middleware on GitHub
    - icon: material/web
      link: https://www.webtech.co.jp/spritestudio/
      name: OPTPiX SpriteStudio
  alternate:
    - name: English
      link: /SSConverterGUI/
      lang: en
    - name: 日本語
      link: /SSConverterGUI/ja/
      lang: ja
