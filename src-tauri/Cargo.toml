[package]
name = "ssconverter-gui"
version = "7.0.0-beta.1"
description = "Convert SpriteStudio (.sspj) projects to .ssab binaries"
authors = ["CRI Middleware Co., Ltd."]
license = "BSD-3-Clause"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# `_lib` keeps the library name distinct from the binary; without it the build
# fails on Windows. See https://github.com/rust-lang/cargo/issues/8519
name = "gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
tauri = { version = "2.12.0", features = [] }
tauri-plugin-opener = "2.7.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ssconverter = { path = "../SpriteStudio-SDK/libs/ssconverter" }
tauri-plugin-dialog = "2.8.0"

